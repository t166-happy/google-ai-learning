<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Google AI × 智慧教育領導</title><style>body{margin:0;background:#eef4f8;color:#19334d;font:18px/1.8 system-ui,sans-serif}main{max-width:850px;margin:8vh auto;padding:28px}header{padding:32px;border-radius:24px;background:linear-gradient(120deg,#173b64,#18867f);color:white}h1{font-size:clamp(28px,5vw,42px);line-height:1.4}section{background:white;padding:28px;border-radius:18px;margin:24px 0}a{color:#135db7}.button{display:inline-block;border-radius:10px;background:#195fa8;color:white;text-decoration:none;padding:10px 20px}input{box-sizing:border-box;width:100%;font:inherit;border:1px solid #9fb3c5;border-radius:8px;padding:12px}button{font:inherit;margin-top:14px;padding:10px 20px;border:0;border-radius:8px;background:#195fa8;color:white}footer{font-size:14px;color:#53697d}#status{min-height:2em}</style></head><body><main><header><div>GOOGLE AI · SMART EDUCATION</div><h1>Google AI × 智慧教育領導</h1><p>從 AI 素養、教學創作到智慧校務，循序完成學習與實作。</p></header><section><h2>學員課程入口</h2><p>請開啟講師提供的場次網址，即可閱讀該場次教材並下載學習檔案。也可在下方貼上場次網址。</p><form id="entry"><label for="session-link">場次網址</label><input id="session-link" type="url" required placeholder="貼上講師提供的學員網址"><button type="submit">進入課程 →</button></form><p id="status" role="status"></p></section><section><h2>講師管理</h2><p>登入後選擇課程、下載教材及 Skills，依日期與名稱建立學員版本。</p><a class="button" href="https://google-ai-education-leadership.workspace-176676.chatgpt.site/instructor">前往講師管理頁面 →</a></section><footer>本站原創教材採 CC BY-NC-SA 4.0 授權；講師肖像及第三方素材除外，依其原授權使用。</footer></main><script>
const backend='https://google-ai-education-leadership.workspace-176676.chatgpt.site';
const status=document.getElementById('status');
const valid=id=>typeof id==='string'&&id.length<500&&/^\d{4}-\d{2}-\d{2}-[\w%~-]+-[a-f0-9]{32}$/.test(id);
function sessionFrom(url){if(url.origin===location.origin&&url.pathname===location.pathname)return url.searchParams.get('session');if(url.origin===backend&&url.pathname.startsWith('/learn/'))return url.pathname.split('/')[2];return null;}
document.getElementById('entry').addEventListener('submit',event=>{event.preventDefault();try{const id=sessionFrom(new URL(document.getElementById('session-link').value));if(!valid(id))throw Error();const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('session',id);location.assign(url.href);}catch(_){status.textContent='請貼上講師提供的有效學員場次網址。'}});
async function load(){const id=new URLSearchParams(location.search).get('session');if(!id)return;if(!valid(id)){status.textContent='場次網址格式不正確。';return;}status.textContent='正在載入本場課程…';try{const res=await fetch(backend+'/public-session/'+id,{credentials:'omit',cache:'no-store'});if(!res.ok){status.textContent=res.status===410?'此課程連結已停用，請聯絡講師。':res.status===404?'找不到此場次，請確認網址。':'課程暫時無法載入，請稍後重試。';return;}const html=await res.text();if(!html.startsWith('<!doctype html>')||!html.includes('id="session-data"'))throw Error();document.open();document.write(html);document.close();}catch(_){status.textContent='目前無法連線至課程服務，請稍後重試或聯絡講師。';}}
load();
</script></body></html>
